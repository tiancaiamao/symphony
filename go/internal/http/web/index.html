<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symphony - Task Board</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="header-left">
            <h1>🎼 Symphony</h1>
            <span class="subtitle">Task Orchestration</span>
        </div>
        <div class="header-actions">
            <button id="refresh-btn" class="btn btn-secondary">
                <span class="icon">🔄</span> Refresh
            </button>
            <button id="new-task-btn" class="btn btn-primary">
                <span class="icon">+</span> New Task
            </button>
        </div>
    </header>

    <main>
        <div class="board">
            <div class="column" id="inbox-column">
                <div class="column-header inbox-header">
                    <h2>📥 Inbox</h2>
                    <span class="count" id="inbox-count">0</span>
                </div>
                <div class="column-body" id="inbox-tasks"></div>
            </div>

            <div class="column" id="todo-column">
                <div class="column-header todo-header">
                    <h2>📋 Todo</h2>
                    <span class="count" id="todo-count">0</span>
                </div>
                <div class="column-body" id="todo-tasks"></div>
            </div>

            <div class="column" id="running-column">
                <div class="column-header running-header">
                    <h2>⚡ Running</h2>
                    <span class="count" id="running-count">0</span>
                </div>
                <div class="column-body" id="running-tasks"></div>
            </div>

            <div class="column" id="self-review-column">
                <div class="column-header self-review-header">
                    <h2>🤖 Self Review</h2>
                    <span class="count" id="self-review-count">0</span>
                </div>
                <div class="column-body" id="self-review-tasks"></div>
            </div>

            <div class="column" id="address-comment-column">
                <div class="column-header address-comment-header">
                    <h2>🔧 Address Comment</h2>
                    <span class="count" id="address-comment-count">0</span>
                </div>
                <div class="column-body" id="address-comment-tasks"></div>
            </div>

            <div class="column" id="done-column">
                <div class="column-header done-header">
                    <h2>✅ Done</h2>
                    <span class="count" id="done-count">0</span>
                </div>
                <div class="column-body" id="done-tasks"></div>
            </div>

            <div class="column" id="archive-column">
                <div class="column-header archive-header">
                    <h2>📦 Archive</h2>
                    <span class="count" id="archive-count">0</span>
                </div>
                <div class="task-list" id="archive-tasks"></div>
            </div>

            <div class="column" id="failed-column">
                <div class="column-header failed-header">
                    <h2>❌ Failed</h2>
                    <span class="count" id="failed-count">0</span>
                </div>
                <div class="column-body" id="failed-tasks"></div>
            </div>
        </div>
    </main>

    <!-- Task Modal -->
    <div id="task-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Task Details</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="task-form">
                    <input type="hidden" id="task-id">
                    <div class="form-group">
                        <label for="task-title">Title *</label>
                        <input type="text" id="task-title" name="title" required placeholder="Enter task title...">
                    </div>
                    <div class="form-group">
                        <label for="task-description">Description</label>
                        <textarea id="task-description" name="description" rows="6" placeholder="Describe what needs to be done..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="task-state">State</label>
                        <input type="text" id="task-state" name="state" readonly>
                    </div>
                    <div class="form-group" id="error-group" style="display: none;">
                        <label for="task-error">⚠️ Last Error</label>
                        <textarea id="task-error" name="error" rows="4" readonly style="background: #fff5f5; border-color: #e74c3c;"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="button" id="save-btn" class="btn btn-primary" onclick="saveTask()">
                    <span class="icon">💾</span> Save
                </button>
                <button type="button" id="retry-btn" class="btn btn-warning hidden" onclick="retryTask()">
                    <span class="icon">🔄</span> Retry
                </button>
                <button type="button" id="delete-btn" class="btn btn-danger hidden" onclick="deleteCurrentTask()">
                    <span class="icon">🗑️</span> Delete
                </button>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
